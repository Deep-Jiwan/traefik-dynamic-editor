http:
    routers:
        grafana:
            rule: Host(`grafana.deep.adgone.co.tz`)
            entryPoints:
                - websecure
            service: grafana
            tls:
                certResolver: cloudflare
        influx-router:
            rule: Host(`influx.deep.adgone.co.tz`)
            entryPoints:
                - websecure
            service: influx-service
            tls:
                certResolver: cloudflare
        openspeedtest:
            rule: Host(`speednew.deep.adgone.co.tz`)
            entryPoints:
                - websecure
            service: openspeedtest
            tls:
                certResolver: cloudflare
        portainer:
            rule: Host(`portainer.deep.adgone.co.tz`)
            entryPoints:
                - websecure
            service: portainer
            tls:
                certResolver: cloudflare
    services:
        grafana:
            loadBalancer:
                servers:
                    - url: http://192.168.88.248:8090
        influx-service:
            loadBalancer:
                servers:
                    - url: http://192.168.88.248:8086
        openspeedtest:
            loadBalancer:
                servers:
                    - url: http://192.168.88.248:3000
        portainer:
            loadBalancer:
                servers:
                    - url: http://portainer:9000
        test:
            loadBalancer:
                servers:
                    - url: http://192.168.88.248:3000
