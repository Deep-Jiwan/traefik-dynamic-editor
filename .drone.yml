platform:
  os: linux
  arch: arm64

kind: pipeline
type: docker
name: build

steps:
  - name: build-docker-image
    image: docker:20.10-cli
    environment:
      DOCKER_BUILDKIT: 1     # Enable modern caching
      GHCR_USERNAME:
        from_secret: ghcr_username
      GHCR_PASSWORD:
        from_secret: ghcr_token
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
    commands:
      - echo $GHCR_PASSWORD | docker login ghcr.io -u $GHCR_USERNAME --password-stdin

      # Pull existing images to use cache
      - docker pull ghcr.io/deep-jiwan/mypackages/traefik-dynamic-editor:latest || true
      - docker pull ghcr.io/deep-jiwan/mypackages/traefik-dynamic-editor:autobuild || true

      # Build with cache-from
      - |
          docker build \
            --tag ghcr.io/deep-jiwan/mypackages/traefik-dynamic-editor:latest \
            --tag ghcr.io/deep-jiwan/mypackages/traefik-dynamic-editor:${DRONE_COMMIT_SHA} \
            --tag ghcr.io/deep-jiwan/mypackages/traefik-dynamic-editor:autobuild \
            --cache-from ghcr.io/deep-jiwan/mypackages/traefik-dynamic-editor:latest \
            --cache-from ghcr.io/deep-jiwan/mypackages/traefik-dynamic-editor:autobuild \
            .

      # Push all tags
      - docker push ghcr.io/deep-jiwan/mypackages/traefik-dynamic-editor:latest
      - docker push ghcr.io/deep-jiwan/mypackages/traefik-dynamic-editor:${DRONE_COMMIT_SHA}
      - docker push ghcr.io/deep-jiwan/mypackages/traefik-dynamic-editor:autobuild


  - name: redeploy-stack
    image: appleboy/drone-ssh
    settings:
      host:
        from_secret: SSH_HOST
      username:
        from_secret: SSH_USER
      key:
        from_secret: SSH_KEY
      script:
        - echo "Switching to compose directory..."
        - cd /home/adgpi0/user-docker/compose/

        - echo "Ensuring service directory exists..."
        - mkdir -p traefik-dynamic-backend
        - cd traefik-dynamic-backend

        - echo "Downloading latest docker compose file (overriding always)..."
        - curl -L -o docker-compose.yml https://raw.githubusercontent.com/Deep-Jiwan/traefik-dynamic-editor/main/docker-compose-deploy.yml

        - echo "Pulling latest images..."
        - docker compose pull

        - echo "Recreating container (rolling update)..."
        - docker compose up -d --force-recreate

        - echo "Deployment completed successfully."


volumes:
  - name: dockersock
    host:
      path: /var/run/docker.sock
