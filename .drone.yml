platform:
  os: linux
  arch: arm64

kind: pipeline
type: docker
name: build

steps:
  - name: build-docker-image
    image: plugins/docker:linux-arm64
    pull: if-not-exists          # do not pull step image unless missing
    settings:
      repo: ghcr.io/deep-jiwan/mypackages/traefik-dynamic-editor
      tags:
        - latest
        - ${DRONE_COMMIT_SHA}
        - autobuild
      dockerfile: dockerfilefast
      registry: ghcr.io
      username:
        from_secret: ghcr_username
      password:
        from_secret: ghcr_token

      # Build platforms (keep arm64)
      platforms:
        - linux/arm64

      # Use BuildKit and try to use registry cache + inline cache
      buildkit: true
      cache_from:
        - ghcr.io/deep-jiwan/mypackages/traefik-dynamic-editor:autobuild
      cache_to:
        - type=inline

      # pass build-args (enable inline cache export in build)
      build_args:
        - BUILDKIT_INLINE_CACHE=1

  - name: redeploy-stack
    image: appleboy/drone-ssh
    pull: if-not-exists
    settings:
      host:
        from_secret: SSH_HOST
      username:
        from_secret: SSH_USER
      key:
        from_secret: SSH_KEY
      script:
        - echo "Downloading latest stack file..."
        - curl -L -o docker-compose-deploy.yml https://raw.githubusercontent.com/Deep-Jiwan/traefik-dynamic-editor/main/docker-compose-deploy.yml

        - IMAGE=ghcr.io/deep-jiwan/mypackages/traefik-dynamic-editor:autobuild
        - echo "Checking if image exists locally on the remote host: $IMAGE"
        - |
          if docker image inspect "$IMAGE" >/dev/null 2>&1; then
            echo "Image exists locally, skipping compose pull."
          else
            echo "Image not found locally — pulling via docker compose..."
            docker compose -f docker-compose-deploy.yml pull
          fi

        - echo "Starting temporary container for rolling update (if image present)..."
        - docker run -d --name traefik-dynamic-backend-temp "$IMAGE" || (echo "Failed to run temp container, trying compose up with pull..." && docker compose -f docker-compose-deploy.yml pull && docker run -d --name traefik-dynamic-backend-temp "$IMAGE")

        - echo "Waiting for temporary container to become healthy (adjust timeout as needed)..."
        - sleep 5

        - echo "Removing old container (if exists)..."
        - docker rm -f traefik-dynamic-backend2 || true  

        - echo "Recreating stack using compose..."
        - docker compose -f docker-compose-deploy.yml up -d --force-recreate

        - echo "Cleaning temporary container..."
        - docker rm -f traefik-dynamic-backend-temp || true
