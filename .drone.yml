platform:
  os: linux
  arch: arm64

kind: pipeline
type: docker
name: build

steps:
  - name: build-docker-image
    image: docker:20.10-cli
    environment:
      DOCKER_BUILDKIT: 1     # Enable modern caching
      GHCR_USERNAME:
        from_secret: ghcr_username
      GHCR_PASSWORD:
        from_secret: ghcr_token
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
    commands:
      - echo $GHCR_PASSWORD | docker login ghcr.io -u $GHCR_USERNAME --password-stdin

      - |
          docker build \
            --tag ghcr.io/deep-jiwan/mypackages/traefik-dynamic-editor:latest \
            --tag ghcr.io/deep-jiwan/mypackages/traefik-dynamic-editor:${DRONE_COMMIT_SHA} \
            --tag ghcr.io/deep-jiwan/mypackages/traefik-dynamic-editor:autobuild \
            --cache-from ghcr.io/deep-jiwan/mypackages/traefik-dynamic-editor:latest \
            --cache-from ghcr.io/deep-jiwan/mypackages/traefik-dynamic-editor:autobuild \
            .
      
      - docker push ghcr.io/deep-jiwan/mypackages/traefik-dynamic-editor:latest
      - docker push ghcr.io/deep-jiwan/mypackages/traefik-dynamic-editor:${DRONE_COMMIT_SHA}
      - docker push ghcr.io/deep-jiwan/mypackages/traefik-dynamic-editor:autobuild

  - name: redeploy-stack
    image: appleboy/drone-ssh
    settings:
      host:
        from_secret: SSH_HOST
      username:
        from_secret: SSH_USER
      key:
        from_secret: SSH_KEY
      script:
        - echo "Downloading latest stack file..."
        - curl -L -o docker-compose-deploy.yml https://raw.githubusercontent.com/Deep-Jiwan/traefik-dynamic-editor/main/docker-compose-deploy.yml

        - echo "Pulling latest image..."
        - docker compose -f docker-compose-deploy.yml pull

        # 1. Start a temporary container for rolling update
        - echo "Starting temporary container..."
        - docker run -d --name traefik-dynamic-backend-temp ghcr.io/deep-jiwan/mypackages/traefik-dynamic-editor:autobuild

        # 2. Wait for new container to be healthy (adjust if you need)
        - echo "Waiting 5s for temporary container..."
        - sleep 5

        # 3. Remove the old main container
        - echo "Removing old container..."
        - docker rm -f traefik-dynamic-backend2 || true  

        # 4. Recreate your main container cleanly using compose
        - echo "Starting main container from compose..."
        - docker compose -f docker-compose-deploy.yml up -d --force-recreate

        # 5. Remove the temporary container
        - echo "Cleaning temporary container..."
        - docker rm -f traefik-dynamic-backend-temp || true

volumes:
  - name: dockersock
    host:
      path: /var/run/docker.sock
