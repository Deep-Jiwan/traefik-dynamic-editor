version: '3.8'
services:
  traefik-dynamic-backend:
    build: 
      context: .
      dockerfile: Dockerfile
    image: traefik-dynamic-editor:latest
    container_name: traefik-dynamic-backend
    ports:
      - "8010:8010"
    environment:
      - PORT=8010
      - DYNAMIC_CONFIG_PATH=../dynamic/dynamic.yml
      - TRAEFIK_CONFIG_PATH=../config/traefik.yml
    volumes:
      - ./dynamic:/app/dynamic:rw
      - ./config:/app/config:rw
      # Frontend is included in the image; do not mount it as a volume so
      # the container serves the packaged frontend files.
    restart: unless-stopped