version: '3.8'
services:
  traefik-dynamic-backend:
    platform: linux/arm64
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TARGETOS: linux
        TARGETARCH: arm64
        TARGETVARIANT: ""
    image: ghcr.io/deep-jiwan/mypackages/traefik-dynamic-editor:build
    container_name: traefik-dynamic-backend
    ports:
      - "8010:8010"
    environment:
      - PORT=8010
      - DYNAMIC_CONFIG_PATH=../dynamic/dynamic.yml
      - TRAEFIK_CONFIG_PATH=../config/traefik.yml
    volumes:
      - /var/lib/docker/volumes/traefik/dynamic:/app/dynamic:rw
      - /var/lib/docker/volumes/traefik/config:/app/config:rw
      # Frontend is included in the image; do not mount it as a volume so
      # the container serves the packaged frontend files.
    restart: unless-stopped