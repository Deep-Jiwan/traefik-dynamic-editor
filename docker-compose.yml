version: '3.8'

services:
  traefik-editor:
    build: ./backend
    container_name: traefik-editor
    ports:
      - "8080:8080"
    volumes:
      - ./dynamic:/dynamic
      - ./frontend:/app/frontend
    environment:
      - DYNAMIC_CONFIG_PATH=/dynamic/dynamic.yml
      - PORT=8080
    restart: unless-stopped

  # Optional: Include Traefik itself for testing
